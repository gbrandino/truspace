# Template C++ Application

# This template allows you to validate your C++ application.
# The workflow allows running tests and code linting on the default branch.


image: 
  name: atlassian/default_image:3 


pipelines:
  default:
    - step:
        name: Build and Run
        runs-on:
          - self.hosted
          - linux
        script:
          - apt update && apt -y install texinfo 
          - /bin/bash ./install.sh 
          #- cd src/nrg && make serial && cd src/truspace && make serial
          # Execute your C++ application after compilation to check success
          #- make distcheck 
    - step:
        name: Test
        runs-on:
          - self.hosted
          - linux
        script:
          - cd src/truspace && make test
